// Vardiya listesi: admin'in yüklediği TEK Excel dosyası, tüm çalışanlarla
// paylaşılır (sharedFiles/vardiya belgesi). Her çalışana özel satır ayırma
// yapılmaz — dosyanın kendisi olduğu gibi gösterilir ve indirilebilir.
async function loadShiftFile() {
  try {
    const doc = await db.collection('sharedFiles').doc('vardiya').get();
    if (doc.exists) {
      const d = doc.data();
      state.shiftFileBase64 = d.fileBase64 || null;
      state.shiftFileName = d.fileName || null;
      state.shiftFileUploadedAt = d.uploadedAt && d.uploadedAt.toDate ? d.uploadedAt.toDate().toISOString() : null;
    } else {
      state.shiftFileBase64 = null; state.shiftFileName = null; state.shiftFileUploadedAt = null;
    }
  } catch (err) {
    console.error('Vardiya dosyası alınamadı:', err.message);
    state.shiftFileBase64 = null;
  }
}
async function handleShiftFileUpload(file) {
  state.shiftFileImporting = true; state.shiftFileError = null; render();
  try {
    const base64 = await fileToBase64(file, 700 * 1024);
    await db.collection('sharedFiles').doc('vardiya').set({
      fileBase64: base64,
      fileName: file.name,
      uploadedAt: firebase.firestore.FieldValue.serverTimestamp(),
      uploadedBy: state.session.user.uid
    });
    state.shiftFileBase64 = base64;
    state.shiftFileName = file.name;
    state.shiftFileUploadedAt = new Date().toISOString();
  } catch (err) {
    state.shiftFileError = err.message || 'Dosya yüklenemedi.';
  } finally {
    state.shiftFileImporting = false; render();
  }
}
async function deleteShiftFile() {
  if (!confirm('Vardiya dosyasını silmek istediğinize emin misiniz?')) return;
  await db.collection('sharedFiles').doc('vardiya').delete();
  state.shiftFileBase64 = null; state.shiftFileName = null; state.shiftFileUploadedAt = null;
  render();
}
// Yüklenen Excel/CSV dosyasının ilk sayfasını tam genişlikte bir HTML
// tabloya çevirir (indirmeye gerek kalmadan "tam ekran" görüntüleme için).
function renderShiftTableHtml() {
  if (!state.shiftFileBase64) return '';
  const name = (state.shiftFileName || '').toLowerCase();
  if (name.endsWith('.pdf')) {
    return `<iframe src="${state.shiftFileBase64}" class="w-full rounded-lg border border-black/10 dark:border-white/10" style="height:75vh"></iframe>`;
  }
  try {
    const isCsv = name.endsWith('.csv');
    const b64 = state.shiftFileBase64.split(',')[1];
    const binary = atob(b64);
    let wb;
    if (isCsv) {
      wb = XLSX.read(binary, { type: 'binary' });
    } else {
      wb = XLSX.read(b64, { type: 'base64' });
    }
    const sheetName = wb.SheetNames[0];
    const html = XLSX.utils.sheet_to_html(wb.Sheets[sheetName], { header: '', footer: '' });
    const note = wb.SheetNames.length > 1
      ? `<p class="mb-3 text-xs text-ink-800/50 dark:text-sand-100/45">"${escapeHtml(sheetName)}" sayfası gösteriliyor (${wb.SheetNames.length} sayfadan). Diğer sayfalar için dosyayı indirin.</p>`
      : '';
    return `<div class="vardiya-table-wrap">${note}${html}</div>`;
  } catch (err) {
    return `<p class="text-sm text-brick-600">Dosya önizlenemedi: ${escapeHtml(err.message)}. Dosyayı indirip açabilirsiniz.</p>`;
  }
}

async function callFunction(name, body) {
  const idToken = await fbAuth.currentUser.getIdToken();
  const res = await fetch(`${FUNCTIONS_BASE}/api/${name}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${idToken}` },
    body: JSON.stringify(body)
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'İşlem başarısız oldu.');
  return data;
}

function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function fmtDate(iso) {
  try {
    return new Intl.DateTimeFormat('tr-TR', { day: '2-digit', month: 'long', year: 'numeric' })
      .format(new Date(iso));
  } catch { return iso; }
}

function timeShort(t) { return t ? String(t).slice(0, 5) : '—'; }
function fmtHours(n) {
  const num = Number(n) || 0;
  const str = num.toLocaleString('tr-TR', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
  return `${str} saat`;
}

// Bir fotoğraf dosyasını tarayıcıda küçültüp base64'e çevirir (Firestore belge
// boyutu sınırı 1MB olduğu için; ayrıca ücretli Storage aboneliği gerekmez).
function compressImageToBase64(file, maxWidth = 900, quality = 0.6) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// Küçük dosyaları (Excel/PDF vb.) base64'e çevirir — Firestore belge boyutu
// sınırı 1MB olduğu için 700KB üstü dosyalar reddedilir.
function fileToBase64(file, maxBytes = 500 * 1024) {
  return new Promise((resolve, reject) => {
    if (file.size > maxBytes) { reject(new Error(`Dosya çok büyük (maks. ${Math.round(maxBytes / 1024)}KB)`)); return; }
    const reader = new FileReader();
    reader.onload = (e) => resolve(e.target.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function daysFromToday(dateStr) {
  if (!dateStr) return null;
  const target = new Date(dateStr + 'T00:00:00');
  const today = new Date(); today.setHours(0, 0, 0, 0);
  return Math.round((target - today) / 86400000);
}
function fmtDaysDiff(dateStr) {
  const d = daysFromToday(dateStr);
  if (d === null || isNaN(d)) return '';
  if (d > 0) return `${d} gün kaldı`;
  if (d < 0) return `${Math.abs(d)} gün gecikti`;
  return 'Bugün';
}

function applyTheme() {
  const stored = localStorage.getItem('theme');
  const dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.classList.toggle('dark', dark);
}
function toggleTheme() {
  const isDark = document.documentElement.classList.toggle('dark');
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
}

  try {
    const doc = await db.collection('profiles').doc(userId).get();
    if (!doc.exists) return null;
    return normalizeProfile(doc.id, doc.data());
  } catch (err) {
    console.error('Profil alınamadı:', err.message);
    return null;
  }
}

async function resolveEmailFromRegistryNumber(registryNumber) {
  try {
    const doc = await db.collection('registryLookup').doc(registryNumber.trim()).get();
    if (!doc.exists) return null;
    return doc.data().email;
  } catch {
    return null;
  }
}

    return;
  }

  if (!state.session) {
    app.innerHTML = loginScreen();
    icons();
    return;
  }

  if (!state.profile) {
    app.innerHTML = loadingScreen('Profil yükleniyor…');
    return;
  }

  const role = state.profile.role;
  const adminRoutes = ['#/admin', '#/admin/employees', '#/admin/import', '#/admin/update-employees', '#/admin/announcements', '#/admin/reports', '#/admin/periodic-checks', '#/admin/absences', '#/admin/shifts'];

  if (adminRoutes.includes(route) && role !== 'admin') {
    location.hash = '#/dashboard';
    return;
  }
  if ((route === '#/login' || route === '' || route === '#/') ) {
    location.hash = role === 'admin' ? '#/admin' : '#/dashboard';
    return;
  }

  let content = '';
  let title = '';
  let subtitle = '';

  if (route === '#/dashboard') {
    title = `Merhaba, ${escapeHtml(state.profile.first_name)} 👋`;
    subtitle = `${escapeHtml(state.profile.department)} · Sicil No: ${escapeHtml(state.profile.registry_number || '—')}`;
    await Promise.all([loadAnnouncements(), loadMyPeriodicChecks(state.profile.id), loadMyAbsences(state.profile.id)]);
    content = employeeDashboardView();
  } else if (route === '#/admin') {
    title = 'Genel Bakış';
    subtitle = 'Yönetici Paneli';
    await Promise.all([loadEmployees(), loadAnnouncements()]);
    content = adminDashboardView();
  } else if (route === '#/admin/employees') {
    title = 'Çalışanlar';
    await loadEmployees();
    subtitle = `${state.employees.length} kayıtlı çalışan`;
    content = adminEmployeesView();
  } else if (route === '#/admin/import') {
    title = 'Toplu Ekleme';
    subtitle = 'Excel veya CSV dosyasından çalışan aktarın';
    await loadEmployees();
    content = adminImportView();
  } else if (route === '#/admin/update-employees') {
    title = 'Çalışan Bilgilerini Güncelle';
    subtitle = 'Yıllık izin, kullanılan izin ve esnek saatleri toplu güncelleyin';
    await loadEmployees();
    content = adminUpdateEmployeesView();
  } else if (route === '#/report') {
    title = 'Öneri / Ramak Kala Bildir';
    subtitle = 'Bir öneriniz veya ramak kala olayınız mı var?';
    await loadMyReports(state.profile.id);
    content = employeeReportView();
  } else if (route === '#/shifts') {
    title = 'Vardiyalarım';
    subtitle = 'Güncel vardiya listesini görüntüleyin veya indirin';
    await loadShiftFile();
    content = employeeShiftsView();
  } else if (route === '#/announcements') {
    title = 'Şirket Duyuruları';
    subtitle = 'Güncel duyuruları görüntüleyin';
    await loadAnnouncements();
    content = employeeAnnouncementsView();
  } else if (route === '#/admin/shifts') {
    title = 'Vardiya Listesi';
    subtitle = 'Tüm çalışanlarla paylaşılan vardiya dosyasını yönetin';
    await loadShiftFile();
    content = adminShiftsView();
  } else if (route === '#/admin/announcements') {
    title = 'Duyurular';
    await loadAnnouncements();
    subtitle = `${state.announcements.length} duyuru yayında`;
    content = adminAnnouncementsView();
  } else if (route === '#/admin/reports') {
    title = 'Bildirimler';
    await loadAllReports();
    subtitle = `${state.allReports.length} bildirim`;
    content = adminReportsView();
  } else if (route === '#/admin/periodic-checks') {
    title = 'Periyodik Kontroller';
    await Promise.all([loadEmployees(), loadAllPeriodicChecks()]);
    subtitle = `${state.periodicChecks.length} kayıtlı kontrol`;
    content = adminPeriodicChecksView();
  } else if (route === '#/admin/absences') {
    title = 'Devamsızlık / İzin Kayıtları';
    await Promise.all([loadEmployees(), loadAllAbsences()]);
    subtitle = `${state.absences.length} kayıt`;
    content = adminAbsencesView();
  } else {
    location.hash = role === 'admin' ? '#/admin' : '#/dashboard';
    return;
  }

  app.innerHTML = shell(title, subtitle, content, role, route);
  icons();
}

function loadingScreen(msg) {

function employeeDashboardView() {
  const p = state.profile;
  // "Kalan İzin" ve daire grafiği admin panelinde/Excel'den elle güncellenen
  // resmi sayıya göre hesaplanır — buna dokunulmuyor.
  const remaining = Math.max(p.annual_leave_total - p.annual_leave_used, 0);
  const pct = p.annual_leave_total > 0 ? Math.min(p.annual_leave_used / p.annual_leave_total, 1) : 0;
  const r = 60, circumference = 2 * Math.PI * r, offset = circumference * (1 - pct);
  // "Kullanılan İzin" yazısı ise Devamsızlık Kayıtları'ndaki (Excel'den
  // günlük aktarılan) "Yıllık İzin" kayıtlarının toplamından hesaplanır —
  // ayrı, bilgi amaçlı bir sayı, "Kalan İzin"i etkilemez.
  const usedFromAbsences = state.myAbsences
    .filter(a => normalizeKey(a.leave_type).includes('yillik'))
    .reduce((sum, a) => sum + (Number(a.days) || 0), 0);
  const anns = state.announcements.slice(0, 10);

  return `
  <div class="grid gap-5 lg:grid-cols-3">
    <div class="lg:col-span-1 space-y-5">
      <div class="card p-6 bg-white dark:bg-ink-800 rounded-xl2 shadow-soft border border-black/5 dark:border-white/5">

            <circle cx="70" cy="70" r="${r}" fill="none" stroke-width="12" class="stroke-sand-200 dark:stroke-ink-700" />
            <circle cx="70" cy="70" r="${r}" fill="none" stroke-width="12" stroke-linecap="round"
              stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"
              class="stroke-gold-500 transition-all duration-700 ease-out" />
          </svg>
          <div class="absolute inset-0 flex flex-col items-center justify-center">
            <span class="font-display text-3xl font-bold text-pine-700 dark:text-gold-400">${remaining}</span>
            <span class="text-xs text-ink-800/55 dark:text-sand-100/50">gün kaldı</span>
          </div>
        </div>
        <dl class="space-y-3 text-sm">
          <div class="flex items-center gap-2"><span class="h-2.5 w-2.5 rounded-full bg-gold-500"></span><dt class="text-ink-800/60 dark:text-sand-100/55">Kullanılan</dt><dd class="font-semibold">${usedFromAbsences} gün</dd></div>
          <div class="flex items-center gap-2"><span class="h-2.5 w-2.5 rounded-full bg-sand-200 dark:bg-ink-700"></span><dt class="text-ink-800/60 dark:text-sand-100/55">Kalan</dt><dd class="font-semibold">${remaining} gün</dd></div>

        <span class="font-display text-2xl font-bold tracking-tight text-pine-700 dark:text-gold-400">Line<span class="text-gold-500">4</span></span>
      </div>
      </div>
    </div>

    <div class="space-y-5 lg:col-span-2">

    <div class="flex flex-wrap items-center justify-between gap-3">

          <div class="min-w-0">

    ? Math.round((employees.reduce((s, e) => s + (e.annual_leave_used / (e.annual_leave_total || 1)), 0) / total) * 100)

  const departments = new Set(employees.map(e => e.department)).size;

  const deptCounts = {};
  employees.forEach(e => {
    const d = e.department || 'Belirtilmemiş';
    deptCounts[d] = (deptCounts[d] || 0) + 1;
  });
  const deptEntries = Object.entries(deptCounts).sort((a, b) => b[1] - a[1]);
  const deptAccentOrder = ['pine', 'gold', 'brick'];

  const rows = employees.map(e => `
    <tr>
      <td class="py-3 pr-3 font-medium text-ink-900 dark:text-sand-50">${escapeHtml(e.first_name)} ${escapeHtml(e.last_name)}</td>

      <td class="py-3">${leaveBar(e.annual_leave_total, e.annual_leave_used, true)}</td>

function exportEmployees() {
  const header = 'registry_number,first_name,last_name,department,annual_leave_total,annual_leave_used,flexible_hours_start,flexible_hours_end,flexible_work_note,flex_time_balance,deducted_hours_balance';
  const csvEscape = (v) => {
    const s = String(v ?? '');
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const lines = state.employees.map(e => [
    e.registry_number, e.first_name, e.last_name, e.department,
    e.annual_leave_total, e.annual_leave_used,
    e.flexible_hours_start || '', e.flexible_hours_end || '', e.flexible_work_note || '',
    e.flex_time_balance ?? 0, e.deducted_hours_balance ?? 0
  ].map(csvEscape).join(','));
  const csv = header + '\n' + lines.join('\n') + '\n';
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `calisanlar-${new Date().toISOString().slice(0, 10)}.csv`; a.click();
  URL.revokeObjectURL(url);
}

/* =====================================================================
   ADMIN — TOPLU EKLEME
   ===================================================================== */
const COLUMN_MAP = {
  registry_number: ['registry_number', 'sicil_no', 'sicil no', 'sicil', 'sicil numarasi'],
  first_name: ['first_name', 'ad', 'isim'],
  last_name: ['last_name', 'soyad'],
  department: ['department', 'departman'],
  annual_leave_total: ['annual_leave_total', 'yillik_izin', 'yillik izin hakki', 'izin_hakki'],
  password: ['password', 'sifre', 'şifre']
};
function normalizeKey(key) {
  // toLocaleLowerCase('tr') kullanılıyor çünkü standart toLowerCase(),
  // Türkçe büyük "İ" harfini düz "i" değil farklı bir karaktere çevirir —
  // bu da "İzleyici", "İzin" gibi kelimelerin tanınmasını engelliyordu.
  return String(key).trim().toLocaleLowerCase('tr')
    .replace(/ı/g, 'i').replace(/ş/g, 's').replace(/ğ/g, 'g')
    .replace(/ü/g, 'u').replace(/ö/g, 'o').replace(/ç/g, 'c');
}
function mapRow(rawRow) {
  const normalized = {};
  for (const [k, v] of Object.entries(rawRow)) normalized[normalizeKey(k)] = v;
  const mapped = {};
  for (const [field, aliases] of Object.entries(COLUMN_MAP)) {
    const foundKey = aliases.map(normalizeKey).find(a => a in normalized);
    if (foundKey) mapped[field] = normalized[foundKey];
  }
  return mapped;
}

/* =====================================================================
   ADMIN — DEVAMSIZLIK / İZİN İZLEYİCİ İÇE AKTARMA
   ===================================================================== */
const ABSENCE_COLUMN_MAP = {
  registry_number: ['sicil', 'sicil no', 'sicil_no', 'registry_number'],
  employee_name: ['calisan adi', 'calisan adi soyadi', 'ad soyad', 'employee_name', 'isim'],
  start_date: ['baslangic tarihi', 'baslangic', 'start_date'],
  end_date: ['bitis tarihi', 'bitis', 'end_date'],
  leave_type: ['izin turu', 'tur', 'leave_type'],
  days: ['gunler', 'gun', 'days'],
  description: ['aciklama', 'description', 'not']
};
function mapAbsenceRow(rawRow) {
  const normalized = {};
  for (const [k, v] of Object.entries(rawRow)) normalized[normalizeKey(k)] = v;
  const mapped = {};
  for (const [field, aliases] of Object.entries(ABSENCE_COLUMN_MAP)) {
    const foundKey = aliases.map(normalizeKey).find(a => a in normalized);
    if (foundKey) mapped[field] = normalized[foundKey];
  }
  if (mapped.registry_number) mapped.registry_number = String(mapped.registry_number).trim();
  return mapped;
}

// "Çalışan İzni İzleyici" gibi isimlendirilmiş sayfayı bulur; yoksa son sayfayı dener.
function findAbsenceSheetName(workbook) {
  const preferred = workbook.SheetNames.find(n => /izleyici|devam/.test(normalizeKey(n)));
  return preferred || workbook.SheetNames[workbook.SheetNames.length - 1];
}

// Sayfa içinde "Sicil" ve "Başlangıç Tarihi" içeren başlık satırını bulup
// altındaki verileri satır nesnelerine çevirir.
function parseAbsenceRowsFromSheet(sheet) {
  const aoa = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false, dateNF: 'yyyy-mm-dd', defval: '' });
  let headerRowIdx = -1, headers = [];
  for (let i = 0; i < Math.min(aoa.length, 30); i++) {
    const normRow = (aoa[i] || []).map(c => normalizeKey(c || ''));
    if (normRow.includes('sicil') && normRow.some(c => c.includes('baslangic'))) {
      headerRowIdx = i; headers = aoa[i]; break;
    }
  }
  if (headerRowIdx === -1) return [];
  const rows = [];
  for (let i = headerRowIdx + 1; i < aoa.length; i++) {
    const raw = aoa[i];
    if (!raw || raw.every(c => c === '' || c === undefined || c === null)) continue;
    const obj = {};
    headers.forEach((h, idx) => { if (h) obj[h] = raw[idx]; });
    const mapped = mapAbsenceRow(obj);
    if (mapped.registry_number) rows.push(mapped);
  }
  return rows;
}

function parseAbsenceFile(file) {
  state.absenceBulkFileName = file.name;
  state.absenceBulkResults = null;
  state.absenceBulkRows = [];
  state.absenceBulkSheetName = '';
  const isCsv = file.name.toLowerCase().endsWith('.csv');
  if (isCsv) {
    Papa.parse(file, {
      header: true, skipEmptyLines: true,
      complete: (res) => {
        state.absenceBulkRows = res.data.map(mapAbsenceRow).filter(r => r.registry_number);
        if (state.absenceBulkRows.length === 0) {
          state.absenceBulkResults = { addedCount: 0, skippedCount: 0, invalidCount: 0, total: 0, error: 'Dosyada Sicil sütunu içeren bir başlık satırı bulunamadı.' };
        }
        render();
      },
      error: (err) => {
        state.absenceBulkResults = { addedCount: 0, skippedCount: 0, invalidCount: 0, total: 0, error: err.message };
        render();
      }
    });
  } else {
    const reader = new FileReader();
    reader.onerror = () => {
      state.absenceBulkResults = { addedCount: 0, skippedCount: 0, invalidCount: 0, total: 0, error: 'Dosya okunamadı. Lütfen tekrar deneyin.' };
      render();
    };
    reader.onload = (ev) => {
      try {
        // readAsArrayBuffer + type:'array' büyük/karmaşık xlsx dosyalarında
        // (koşullu biçimlendirme, veri doğrulama vb. içerenlerde) eski
        // 'binary' yöntemine göre çok daha güvenilirdir.
        const wb = XLSX.read(ev.target.result, { type: 'array' });
        const sheetName = findAbsenceSheetName(wb);
        const sheet = wb.Sheets[sheetName];
        const rows = parseAbsenceRowsFromSheet(sheet);
        state.absenceBulkSheetName = sheetName;
        if (rows.length === 0) {
          state.absenceBulkResults = {
            addedCount: 0, skippedCount: 0, invalidCount: 0, total: 0,
            error: `"${sheetName}" sayfasında Sicil / Başlangıç Tarihi sütunlarını içeren bir başlık satırı bulunamadı. Sayfa adını veya sütun başlıklarını kontrol edin.`
          };
        }
        state.absenceBulkRows = rows;
      } catch (err) {
        state.absenceBulkResults = { addedCount: 0, skippedCount: 0, invalidCount: 0, total: 0, error: 'Dosya okunurken hata oluştu: ' + err.message };
      }
      render();
    };
    reader.readAsArrayBuffer(file);
  }
}

// Bir devamsızlık satırı için, aynı çalışan + aynı tarih aralığı + aynı izin
// türü tekrar yüklendiğinde AYNI belge kimliğini üretir. Böylece Excel'i her
// gün olduğu gibi yeniden yüklemek güvenlidir: eski satırlar üzerine sadece
// üzerine yazılır (kopya oluşturmaz), sadece gerçekten yeni satırlar eklenir.
function absenceDocId(r) {
  const slug = s => normalizeKey(s || '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  const id = `${slug(r.registry_number)}_${slug(r.start_date)}_${slug(r.end_date || r.start_date)}_${slug(r.leave_type)}`;
  return id.slice(0, 400) || null;
}

// Sicil numaralarını karşılaştırırken baştaki/sondaki boşlukları ve
// başta gereksiz sıfırları yok sayar (örn. " 64704 " ile "064704" veya
// "64704" hep aynı çalışan olarak eşleşsin diye).
function regNorm(v) {
  return String(v ?? '').trim().replace(/^0+(?=\d)/, '');
}
function findEmployeeByRegistry(registryNumber) {
  const target = regNorm(registryNumber);
  if (!target) return null;
  return state.employees.find(e => regNorm(e.registry_number) === target) || null;
}

// Daha önce, eşleştirme mantığı henüz düzeltilmemişken içeri aktarılmış
// kayıtların employeeId alanı boş kalmış olabilir. Bu fonksiyon, halihazırda
// kayıtlı ama bir çalışana bağlanmamış devamsızlık kayıtlarını, sicil
// numarasına göre tekrar eşleştirip Firestore'da günceller.
async function reconcileAbsenceEmployeeIds() {
  state.absenceImporting = true; render();
  try {
    const unmatched = state.absences.filter(a => !a.employee_id && a.registry_number);
    let fixedCount = 0;
    const CHUNK = 400;
    for (let i = 0; i < unmatched.length; i += CHUNK) {
      const batch = db.batch();
      let hasWrites = false;
      unmatched.slice(i, i + CHUNK).forEach(a => {
        const match = findEmployeeByRegistry(a.registry_number);
        if (match) {
          batch.update(db.collection('absences').doc(a.id), {
            employeeId: match.id,
            employeeName: a.employee_name || `${match.first_name} ${match.last_name}`
          });
          hasWrites = true;
          fixedCount++;
        }
      });
      if (hasWrites) await batch.commit();
    }
    state.absenceBulkResults = { addedCount: 0, skippedCount: 0, invalidCount: 0, total: 0, reconciled: fixedCount, unmatchedTotal: unmatched.length };
    await loadAllAbsences();
  } catch (err) {
    state.absenceBulkResults = { addedCount: 0, skippedCount: 0, invalidCount: 0, total: 0, error: err.message };
  } finally {
    state.absenceImporting = false; render();
  }
}

async function handleAbsenceImport() {
  state.absenceImporting = true; render();
  try {
    // Daha önce içeri aktarılmış kayıtları bilmiyorsak (sayfa yeni açıldıysa)
    // önce onları çekelim ki hangi satırların zaten var olduğunu görebilelim.
    if (state.absences.length === 0) await loadAllAbsences();
    const existingIds = new Set(state.absences.map(a => a.id));

    const rows = state.absenceBulkRows;
    let addedCount = 0, skippedCount = 0, invalidCount = 0;
    const CHUNK = 400;
    for (let i = 0; i < rows.length; i += CHUNK) {
      const batch = db.batch();
      let batchHasWrites = false;
      rows.slice(i, i + CHUNK).forEach(r => {
        const docId = absenceDocId(r);
        if (!docId) { invalidCount++; return; }
        if (existingIds.has(docId)) { skippedCount++; return; }
        existingIds.add(docId);
        const match = findEmployeeByRegistry(r.registry_number);
        const ref = db.collection('absences').doc(docId);
        batch.set(ref, {
          registryNumber: r.registry_number,
          employeeId: match ? match.id : null,
          employeeName: r.employee_name || (match ? `${match.first_name} ${match.last_name}` : ''),
          leaveType: r.leave_type || '',
          startDate: r.start_date || '',
          endDate: r.end_date || r.start_date || '',
          days: r.days ? Number(r.days) : null,
          description: r.description || '',
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        batchHasWrites = true;
        addedCount++;
      });
      if (batchHasWrites) await batch.commit();
    }
    state.absenceBulkResults = { addedCount, skippedCount, invalidCount, total: rows.length };
    state.absenceBulkRows = [];
    state.absenceBulkFileName = '';
    await loadAllAbsences();
  } catch (err) {
    state.absenceBulkResults = { addedCount: 0, skippedCount: 0, invalidCount: 0, total: state.absenceBulkRows.length, error: err.message };
  } finally {
    state.absenceImporting = false; render();
  }
}

/* =====================================================================
   ADMIN — MEVCUT ÇALIŞANLARI TOPLU GÜNCELLEME
   (Yıllık izin hakkı / kullanılan izin / esnek çalışma saatleri)
   ===================================================================== */
const UPDATE_COLUMN_MAP = {
  registry_number: ['registry_number', 'sicil_no', 'sicil no', 'sicil', 'sicil numarasi'],
  annual_leave_total: ['annual_leave_total', 'yillik_izin', 'yillik izin hakki', 'izin_hakki', 'toplam hak'],
  annual_leave_used: ['annual_leave_used', 'kullanilan izin', 'kullanilan'],
  flexible_hours_start: ['flexible_hours_start', 'esnek baslangic', 'esnek calisma baslangic'],
  flexible_hours_end: ['flexible_hours_end', 'esnek bitis', 'esnek calisma bitis'],
  flexible_work_note: ['flexible_work_note', 'esnek not', 'not'],
  flex_time_balance: ['flex_time_balance', 'esnek bakiye', 'esnek_bakiye'],
  deducted_hours_balance: ['deducted_hours_balance', 'kesilen saat bakiyesi', 'kesilen_saat_bakiyesi', 'kesilen saat']
};
function mapUpdateRow(rawRow) {
  const normalized = {};
  for (const [k, v] of Object.entries(rawRow)) normalized[normalizeKey(k)] = v;
  const mapped = {};
  for (const [field, aliases] of Object.entries(UPDATE_COLUMN_MAP)) {
    const foundKey = aliases.map(normalizeKey).find(a => a in normalized);
    if (foundKey && normalized[foundKey] !== '' && normalized[foundKey] !== undefined) mapped[field] = normalized[foundKey];
  }
  if (mapped.registry_number) mapped.registry_number = String(mapped.registry_number).trim();
  return mapped;
}
function parseUpdateFile(file) {
  state.updateBulkFileName = file.name;
  state.updateBulkResults = null;
  const isCsv = file.name.toLowerCase().endsWith('.csv');
  if (isCsv) {
    Papa.parse(file, {
      header: true, skipEmptyLines: true,
      complete: (res) => { state.updateBulkRows = res.data.map(mapUpdateRow).filter(r => r.registry_number); render(); }
    });
  } else {
    const reader = new FileReader();
    reader.onerror = () => {
      state.updateBulkResults = { updatedCount: 0, notFoundCount: 0, error: 'Dosya okunamadı.' };
      render();
    };
    reader.onload = (ev) => {
      try {
        const wb = XLSX.read(ev.target.result, { type: 'array' });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const json = XLSX.utils.sheet_to_json(sheet, { raw: false, defval: '' });
        state.updateBulkRows = json.map(mapUpdateRow).filter(r => r.registry_number);
      } catch (err) {
        state.updateBulkResults = { updatedCount: 0, notFoundCount: 0, error: 'Dosya okunurken hata oluştu: ' + err.message };
      }
      render();
    };
    reader.readAsArrayBuffer(file);
  }
}
// Excel/CSV'den gelen sayılar bazen virgüllü ondalık olarak gelebilir
// (örn. "-7,73"). JS'in Number() fonksiyonu bunu NaN'a çevirip sessizce
// 0 gibi görünmesine yol açıyordu — virgülü noktaya çevirerek düzeltiyoruz.
function parseNum(v) {
  if (v === undefined || v === null || v === '') return NaN;
  const n = Number(String(v).trim().replace(',', '.'));
  return n;
}
async function handleBulkUpdate() {
  state.updateImporting = true; render();
  try {
    const rows = state.updateBulkRows;
    let updatedCount = 0, notFoundCount = 0;
    const notFoundRegistries = [];
    const CHUNK = 400;
    for (let i = 0; i < rows.length; i += CHUNK) {
      const batch = db.batch();
      let hasWrites = false;
      rows.slice(i, i + CHUNK).forEach(r => {
        const match = findEmployeeByRegistry(r.registry_number);
        if (!match) { notFoundCount++; notFoundRegistries.push(r.registry_number); return; }
        const payload = {};
        if (r.annual_leave_total !== undefined && !isNaN(parseNum(r.annual_leave_total))) payload.annualLeaveTotal = parseNum(r.annual_leave_total);
        if (r.annual_leave_used !== undefined && !isNaN(parseNum(r.annual_leave_used))) payload.annualLeaveUsed = parseNum(r.annual_leave_used);
        if (r.flexible_hours_start !== undefined) payload.flexibleHoursStart = r.flexible_hours_start;
        if (r.flexible_hours_end !== undefined) payload.flexibleHoursEnd = r.flexible_hours_end;
        if (r.flexible_work_note !== undefined) payload.flexibleWorkNote = r.flexible_work_note;
        if (r.flex_time_balance !== undefined && !isNaN(parseNum(r.flex_time_balance))) payload.flexTimeBalance = parseNum(r.flex_time_balance);
        if (r.deducted_hours_balance !== undefined && !isNaN(parseNum(r.deducted_hours_balance))) payload.deductedHoursBalance = parseNum(r.deducted_hours_balance);
        if (Object.keys(payload).length === 0) return;
        batch.update(db.collection('profiles').doc(match.id), payload);
        hasWrites = true;
        updatedCount++;
      });
      if (hasWrites) await batch.commit();
    }
    state.updateBulkResults = { updatedCount, notFoundCount, notFoundRegistries };
    state.updateBulkRows = [];
    state.updateBulkFileName = '';
    await loadEmployees();
  } catch (err) {
    state.updateBulkResults = { updatedCount: 0, notFoundCount: 0, error: err.message };
  } finally {
    state.updateImporting = false; render();
  }
}
function downloadUpdateTemplate() {
  const csv = 'registry_number,annual_leave_total,annual_leave_used,flexible_hours_start,flexible_hours_end,flexible_work_note,flex_time_balance,deducted_hours_balance\n64704,27,5,08:00,17:00,Standart mesai,0,0\n';
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'calisan-guncelleme-sablonu.csv'; a.click();
  URL.revokeObjectURL(url);
}

function modalHtml() {
  if (!state.modal) return '';
  if (state.modal.type === 'employee') return employeeModal(state.modal.data);
  if (state.modal.type === 'announcement') return announcementModal(state.modal.data);
  if (state.modal.type === 'periodic-check') return periodicCheckModal(state.modal.data);
  if (state.modal.type === 'bulk-password') return bulkPasswordModal();
  return '';
}

  const employees = state.employees;

  return `
  <div class="fixed inset-0 z-50 flex items-center justify-center modal-backdrop p-4" data-action="modal-backdrop">
    <div class="max-h-[90vh] w-full max-w-lg overflow-y-auto rounded-xl2 bg-white dark:bg-ink-800 shadow-soft" data-stop-close>

          <select name="employee_id" required class="input">
            <option value="">Seçin…</option>
            ${employees.map(e => `<option value="${e.id}" ${isEdit && check.employee_id === e.id ? 'selected' : ''}>${escapeHtml(e.first_name)} ${escapeHtml(e.last_name)} — ${escapeHtml(e.department)}</option>`).join('')}
          </select>
        </div>
        <div>
          <label class="label">Kontrol Türü</label>
          <select name="check_type_select" id="check-type-select" class="input">
            <option value="saglik" ${isEdit && check.check_type === 'saglik' ? 'selected' : ''}>Periyodik Sağlık Kontrolü</option>
            <option value="revir" ${isEdit && check.check_type === 'revir' ? 'selected' : ''}>Revir Kontrolü</option>
            <option value="hastane" ${isEdit && check.check_type === 'hastane' ? 'selected' : ''}>Hastane Kontrolü</option>
            <option value="egitim" ${isEdit && check.check_type === 'egitim' ? 'selected' : ''}>Eğitim</option>
            <option value="__other__" ${isOtherType ? 'selected' : ''}>Diğer (yazın)</option>
          </select>
          <input name="check_type_other" id="check-type-other" class="input mt-2 ${isOtherType ? '' : 'hidden'}" placeholder="Kontrol türünü yazın" value="${isOtherType ? escapeHtml(check.check_type) : ''}" />
        </div>
        <div>
          <label class="label">Tarih</label>
          <input name="due_date" type="date" required class="input" value="${isEdit ? check.due_date : new Date().toISOString().slice(0, 10)}" />
        </div>
        <div>
          <label class="label">Durum</label>
          <select name="status" required class="input">
            ${Object.entries(PERIODIC_STATUS_LABELS).map(([val, label]) => `<option value="${val}" ${isEdit && check.status === val ? 'selected' : (!isEdit && val === 'yaklasiyor' ? 'selected' : '')}>${label}</option>`).join('')}
          </select>
        </div>
        <div id="periodic-check-form-error"></div>
        <div class="flex justify-end gap-3 pt-2">
          <button type="button" data-action="close-modal" class="btn-secondary inline-flex items-center justify-center gap-2 rounded-lg px-4 py-2.5 text-sm font-medium bg-sand-100 text-ink-800 hover:bg-sand-200 dark:bg-ink-700 dark:text-sand-100">Vazgeç</button>
          <button type="submit" id="periodic-check-form-submit" class="btn-primary inline-flex items-center justify-center gap-2 rounded-lg px-4 py-2.5 text-sm font-medium bg-pine-600 text-white hover:bg-pine-700">${isEdit ? 'Değişiklikleri Kaydet' : 'Kontrolü Ekle'}</button>
        </div>
      </form>
    </div>
  </div>`;
}

/* =====================================================================
   OLAY YÖNETİMİ (event delegation)
   ===================================================================== */
document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-action]');

  // Modal dışına tıklayınca kapat (içeriğe tıklamayı hariç tut)
  if (el && el.dataset.action === 'modal-backdrop' && e.target === el) {
    state.modal = null; render(); return;
  }

  const link = e.target.closest('a[data-action="nav-link"]');
  if (link) { state.sidebarOpen = false; /* hashchange render'ı tetikler */ return; }

  if (!el) return;
  const action = el.dataset.action;

  switch (action) {
    case 'open-sidebar': state.sidebarOpen = true; render(); break;
    case 'close-sidebar': state.sidebarOpen = false; render(); break;
    case 'toggle-theme': toggleTheme(); break;
    case 'logout': await fbAuth.signOut(); break;
    case 'close-modal': state.modal = null; render(); break;
    case 'open-employee-form': state.modal = { type: 'employee', data: null }; render(); break;
    case 'edit-employee': {
      const emp = state.employees.find(x => x.id === el.dataset.id);
      state.modal = { type: 'employee', data: emp }; render(); break;
    }
    case 'delete-employee': {
      if (confirm(`${el.dataset.name} adlı çalışanı silmek istediğinize emin misiniz?`)) {
        try {
          await callFunction('delete-employee', { uid: el.dataset.id });
        } catch (err) {
          alert(err.message);
        }
        await loadEmployees(); render();
      }
      break;
    }
    case 'open-announcement-form':
      state.announcementImageBase64 = null;
      state.announcementAttachmentBase64 = null;
      state.announcementAttachmentName = null;
      state.modal = { type: 'announcement', data: null }; render(); break;
    case 'edit-announcement': {
      const ann = state.announcements.find(x => x.id === el.dataset.id);
      state.announcementImageBase64 = ann?.image_base64 || null;
      state.announcementAttachmentBase64 = ann?.attachment_base64 || null;
      state.announcementAttachmentName = ann?.attachment_name || null;
      state.modal = { type: 'announcement', data: ann }; render(); break;
    }
    case 'delete-announcement': {
      if (confirm('Bu duyuruyu silmek istediğinize emin misiniz?')) {
        await db.collection('announcements').doc(el.dataset.id).delete();
        await loadAnnouncements(); render();
      }
      break;
    }
    case 'download-template': downloadTemplate(); break;
    case 'import-bulk': await handleBulkImport(); break;
    case 'add-bulk-row':
      state.bulkRows = [...state.bulkRows, {
        first_name: '', last_name: '', registry_number: '', department: '',
        annual_leave_total: 14, password: ''
      }];
      render();
      break;
    case 'remove-bulk-row':
      state.bulkRows = state.bulkRows.filter((_, idx) => idx !== Number(el.dataset.index));
      render();
      break;
    case 'delete-report': {
      if (confirm('Bu bildirimi silmek istediğinize emin misiniz?')) {
        await db.collection('reports').doc(el.dataset.id).delete();
        await loadAllReports(); render();
      }
      break;
    }
    case 'filter-reports':
      state.adminReportFilter = el.dataset.value;
      render();
      break;
    case 'open-periodic-check-form':
      state.modal = { type: 'periodic-check', data: null };
      render();
      break;
    case 'open-bulk-password-form':
      state.modal = { type: 'bulk-password' };
      render();
      break;
    case 'edit-periodic-check': {
      const check = state.periodicChecks.find(x => x.id === el.dataset.id);
      state.modal = { type: 'periodic-check', data: check };
      render();
      break;
    }
    case 'delete-periodic-check': {
      if (confirm('Bu periyodik kontrolü silmek istediğinize emin misiniz?')) {
        await db.collection('periodicChecks').doc(el.dataset.id).delete();
        await loadAllPeriodicChecks(); render();
      }
      break;
    }
    case 'import-absences': await handleAbsenceImport(); break;
    case 'reconcile-absences': await reconcileAbsenceEmployeeIds(); break;
    case 'import-updates': await handleBulkUpdate(); break;
    case 'download-update-template': downloadUpdateTemplate(); break;
    case 'export-employees': exportEmployees(); break;
    case 'remove-announcement-image': state.announcementImageBase64 = null; render(); break;
    case 'remove-announcement-attachment':
      state.announcementAttachmentBase64 = null; state.announcementAttachmentName = null; render(); break;
    case 'delete-shift-file': await deleteShiftFile(); break;
    case 'delete-absence': {
      if (confirm('Bu devamsızlık/izin kaydını silmek istediğinize emin misiniz?')) {
        await db.collection('absences').doc(el.dataset.id).delete();
        await loadAllAbsences(); render();
      }
      break;
    }
  }
});

document.addEventListener('change', async (e) => {
  if (e.target.dataset.action === 'change-report-status') {
    const id = e.target.dataset.id;
    const status = e.target.value;
    await db.collection('reports').doc(id).update({ status });
    await loadAllReports(); render();
  }
  if (e.target.id === 'department-select') {
    const other = document.getElementById('department-other');
    if (other) {
      if (e.target.value === '__other__') {
        other.classList.remove('hidden');
        other.focus();
      } else {
        other.classList.add('hidden');
      }
    }
  }
  if (e.target.id === 'check-type-select') {
    const other = document.getElementById('check-type-other');
    if (other) {
      if (e.target.value === '__other__') {
        other.classList.remove('hidden');
        other.focus();
      } else {
        other.classList.add('hidden');
      }
    }
  }
  if (e.target.id === 'on-sick-leave-checkbox') {
    const wrap = document.getElementById('sick-leave-date-wrap');
    if (wrap) wrap.classList.toggle('hidden', !e.target.checked);
  }
});

document.addEventListener('input', (e) => {
  if (e.target.id === 'employee-search') {

document.addEventListener('submit', async (e) => {
  if (e.target.id === 'login-form') {
    e.preventDefault();
    const registryNumber = document.getElementById('login-registry').value;
    const password = document.getElementById('login-password').value;
    const btn = document.getElementById('login-submit');
    const errBox = document.getElementById('login-error');
    errBox.innerHTML = '';
    btn.disabled = true; btn.textContent = 'Giriş yapılıyor…';

    const email = await resolveEmailFromRegistryNumber(registryNumber);
    if (!email) {
      errBox.innerHTML = `<p class="rounded-lg bg-brick-500/10 px-3.5 py-2.5 text-sm text-brick-600">Bu sicil numarasıyla kayıtlı bir kullanıcı bulunamadı.</p>`;
      btn.disabled = false; btn.textContent = 'Giriş Yap';
      return;
    }

    try {
      const remember = document.getElementById('login-remember')?.checked;
      const persistence = remember ? firebase.auth.Auth.Persistence.LOCAL : firebase.auth.Auth.Persistence.SESSION;
      await fbAuth.setPersistence(persistence);
      await fbAuth.signInWithEmailAndPassword(email, password);
    } catch (err) {
      errBox.innerHTML = `<p class="rounded-lg bg-brick-500/10 px-3.5 py-2.5 text-sm text-brick-600">Sicil numarası veya şifre hatalı. Lütfen tekrar deneyin.</p>`;
      btn.disabled = false; btn.textContent = 'Giriş Yap';
    }
    return;
  }

  if (e.target.id === 'report-form') {
    e.preventDefault();
    const form = e.target;
    const fd = new FormData(form);
    state.reportFormError = '';
    state.reportSubmitting = true;
    const submitBtn = form.querySelector('button[type="submit"]');
    if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = 'Gönderiliyor…'; }

    try {
      await db.collection('reports').add({
        type: fd.get('type'),
        riskLevel: fd.get('risk_level'),
        description: fd.get('description'),
        date: fd.get('date'),
        shift: fd.get('shift'),
        department: fd.get('department'),
        photo: state.reportPhotoData || null,
        status: 'yeni',
        submittedBy: state.profile.id,
        submitterName: `${state.profile.first_name} ${state.profile.last_name}`,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      state.reportPhotoData = null;
      state.reportSubmitting = false;
      await loadMyReports(state.profile.id);
      render();
    } catch (err) {
      state.reportFormError = err.message || 'Bildirim gönderilirken bir hata oluştu.';
      state.reportSubmitting = false;
      render();
    }
    return;
  }

  if (e.target.id === 'employee-form') {
    e.preventDefault();
    const form = e.target;
    const id = form.dataset.id;
    const fd = new FormData(form);
    const btn = document.getElementById('employee-form-submit');
    const errBox = document.getElementById('employee-form-error');
    errBox.innerHTML = '';
    btn.disabled = true; btn.textContent = 'Kaydediliyor…';

    try {
      const deptSelect = fd.get('department_select');
      const department = deptSelect === '__other__' ? (fd.get('department_other') || '').trim() : deptSelect;
      if (!department) {
        throw new Error('Lütfen bir departman seçin veya "Diğer" için isim yazın.');
      }

      if (id) {
        await db.collection('profiles').doc(id).update({
          department,
          annualLeaveTotal: Number(fd.get('annual_leave_total')),
          annualLeaveUsed: Number(fd.get('annual_leave_used')),
          flexibleWorkNote: fd.get('flexible_work_note'),
          flexTimeBalance: Number(fd.get('flex_time_balance')) || 0,
          deductedHoursBalance: Number(fd.get('deducted_hours_balance')) || 0,
          onSickLeave: fd.get('on_sick_leave') === 'on',
          sickLeaveEndDate: fd.get('on_sick_leave') === 'on' ? (fd.get('sick_leave_end_date') || null) : null
        });

        const newPassword = fd.get('new_password');
        if (newPassword && newPassword.trim().length > 0) {
          if (newPassword.trim().length < 6) {
            throw new Error('Yeni şifre en az 6 karakter olmalı.');
          }
          await callFunction('change-password', { uid: id, new_password: newPassword.trim() });
        }
      } else {
        await callFunction('create-employee', {
          registry_number: fd.get('registry_number'),
          password: fd.get('password'),
          first_name: fd.get('first_name'),
          last_name: fd.get('last_name'),
          department,
          role: fd.get('is_admin') ? 'admin' : 'employee',
          annual_leave_total: Number(fd.get('annual_leave_total')),
          flexible_work_note: fd.get('flexible_work_note'),
          flex_time_balance: Number(fd.get('flex_time_balance')) || 0,
          deducted_hours_balance: Number(fd.get('deducted_hours_balance')) || 0
        });
      }
      state.modal = null;
      await loadEmployees();
      render();
    } catch (err) {
      errBox.innerHTML = `<p class="rounded-lg bg-brick-500/10 px-3.5 py-2.5 text-sm text-brick-600">${escapeHtml(err.message || 'Bir hata oluştu.')}</p>`;
      btn.disabled = false; btn.textContent = id ? 'Değişiklikleri Kaydet' : 'Çalışanı Ekle';
    }
    return;
  }

  if (e.target.id === 'announcement-form') {
    e.preventDefault();
    const form = e.target;
    const id = form.dataset.id;
    const fd = new FormData(form);
    const btn = document.getElementById('announcement-form-submit');
    btn.disabled = true; btn.textContent = 'Kaydediliyor…';

    const publishedAt = firebase.firestore.Timestamp.fromDate(new Date(fd.get('published_at')));
    const imageBase64 = state.announcementImageBase64 || null;
    const attachmentBase64 = state.announcementAttachmentBase64 || null;
    const attachmentName = state.announcementAttachmentName || null;
    let ok = true;
    try {
      if (id) {
        await db.collection('announcements').doc(id).update({
          title: fd.get('title'),
          content: fd.get('content'),
          publishedAt,
          imageBase64,
          attachmentBase64,
          attachmentName
        });
      } else {
        await db.collection('announcements').add({
          title: fd.get('title'),
          content: fd.get('content'),
          publishedAt,
          imageBase64,
          attachmentBase64,
          attachmentName,
          createdBy: state.session.user.uid,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      }
    } catch {
      ok = false;
    }
    if (ok) {
      state.modal = null;
      await loadAnnouncements();
      render();
    } else {
      document.getElementById('announcement-form-error').innerHTML =
        `<p class="rounded-lg bg-brick-500/10 px-3.5 py-2.5 text-sm text-brick-600">Kaydedilirken bir hata oluştu.</p>`;
      btn.disabled = false; btn.textContent = 'Kaydet';
    }
    return;
  }

  if (e.target.id === 'periodic-check-form') {
    e.preventDefault();
    const form = e.target;
    const id = form.dataset.id;
    const fd = new FormData(form);
    const btn = document.getElementById('periodic-check-form-submit');
    const errBox = document.getElementById('periodic-check-form-error');
    errBox.innerHTML = '';
    btn.disabled = true; btn.textContent = 'Kaydediliyor…';

    try {
      const employeeId = fd.get('employee_id');
      if (!employeeId) throw new Error('Lütfen bir çalışan seçin.');
      const emp = state.employees.find(x => x.id === employeeId);
      if (!emp) throw new Error('Seçilen çalışan bulunamadı.');

      const typeSelect = fd.get('check_type_select');
      const checkType = typeSelect === '__other__' ? (fd.get('check_type_other') || '').trim() : typeSelect;
      if (!checkType) throw new Error('Lütfen bir kontrol türü seçin veya "Diğer" için isim yazın.');

      const payload = {
        employeeId,
        employeeName: `${emp.first_name} ${emp.last_name}`,
        department: emp.department,
        checkType,
        dueDate: fd.get('due_date'),
        status: fd.get('status')
      };

      if (id) {
        await db.collection('periodicChecks').doc(id).update(payload);
      } else {
        await db.collection('periodicChecks').add({
          ...payload,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      }
      state.modal = null;
      await loadAllPeriodicChecks();
      render();
    } catch (err) {
      errBox.innerHTML = `<p class="rounded-lg bg-brick-500/10 px-3.5 py-2.5 text-sm text-brick-600">${escapeHtml(err.message || 'Bir hata oluştu.')}</p>`;
      btn.disabled = false; btn.textContent = id ? 'Değişiklikleri Kaydet' : 'Kontrolü Ekle';
    }
    return;
  }

  if (e.target.id === 'bulk-password-form') {
    e.preventDefault();
    const form = e.target;
    const fd = new FormData(form);
    const btn = document.getElementById('bulk-password-form-submit');
    const errBox = document.getElementById('bulk-password-form-error');
    const resultsBox = document.getElementById('bulk-password-results');
    errBox.innerHTML = '';
    resultsBox.innerHTML = '';

    const newPassword = fd.get('new_password');
    if (!newPassword || newPassword.length < 6) {
      errBox.innerHTML = `<p class="rounded-lg bg-brick-500/10 px-3.5 py-2.5 text-sm text-brick-600">Şifre en az 6 karakter olmalı.</p>`;
      return;
    }
    if (!confirm('TÜM çalışanların şifresini değiştirmek istediğinize emin misiniz? Bu işlem geri alınamaz.')) {
      return;
    }

    btn.disabled = true; btn.textContent = 'Değiştiriliyor…';
    try {
      const data = await callFunction('bulk-change-password', { new_password: newPassword });
      resultsBox.innerHTML = `
        <p class="text-sm font-medium text-pine-700 dark:text-gold-400">${data.successCount} / ${data.total} çalışanın şifresi değiştirildi.</p>
        ${data.results.filter(r => !r.success).map(r => `
          <p class="text-xs text-brick-500">Sicil No ${escapeHtml(r.registry_number || '—')}: ${escapeHtml(r.error)}</p>`).join('')}
      `;
      btn.textContent = 'Tamamlandı';
    } catch (err) {
      errBox.innerHTML = `<p class="rounded-lg bg-brick-500/10 px-3.5 py-2.5 text-sm text-brick-600">${escapeHtml(err.message || 'Bir hata oluştu.')}</p>`;
      btn.disabled = false; btn.textContent = 'Tümünü Değiştir';
    }
  }
});

  }

    state.adminAbsenceSearch = e.target.value;
    render();
    document.getElementById('absence-search')?.focus();
  }
});
document.addEventListener('change', (e) => {
  if (e.target.id === 'bulk-file-input') {
    const file = e.target.files?.[0];
    if (file) parseBulkFile(file);
  }
  if (e.target.id === 'absence-file-input') {
    const file = e.target.files?.[0];
    if (file) parseAbsenceFile(file);
  }
  if (e.target.id === 'update-file-input') {
    const file = e.target.files?.[0];
    if (file) parseUpdateFile(file);
  }
  if (e.target.id === 'shift-file-input') {
    const file = e.target.files?.[0];
    if (file) handleShiftFileUpload(file);
  }
  if (e.target.id === 'announcement-image-input') {
    const file = e.target.files?.[0];
    if (file) {
      compressImageToBase64(file).then(b64 => { state.announcementImageBase64 = b64; render(); })
        .catch(() => alert('Görsel yüklenemedi.'));
    }
  }
  if (e.target.id === 'announcement-attachment-input') {
    const file = e.target.files?.[0];
    if (file) {
      fileToBase64(file).then(b64 => {
        state.announcementAttachmentBase64 = b64;
        state.announcementAttachmentName = file.name;
        render();
      }).catch(err => alert(err.message || 'Dosya yüklenemedi.'));
    }
  }
  if (e.target.id === 'report-photo-input') {
    const file = e.target.files?.[0];
    if (file) {
      compressImageToBase64(file).then(dataUrl => {
        state.reportPhotoData = dataUrl;
        const preview = document.getElementById('report-photo-preview');
        if (preview) {
          preview.innerHTML = `<img src="${dataUrl}" class="mt-2 max-h-40 rounded-lg border border-black/10 dark:border-white/10" />`;
        }
      });
    }
  }
});
document.addEventListener('dragover', (e) => {
  if (e.target.closest('#dropzone') || e.target.closest('#absence-dropzone') || e.target.closest('#update-dropzone') || e.target.closest('#shift-dropzone')) e.preventDefault();
});
document.addEventListener('drop', (e) => {
  const dz = e.target.closest('#dropzone');
  if (dz) {
    e.preventDefault();
    const file = e.dataTransfer.files?.[0];
    if (file) parseBulkFile(file);
  }
  const adz = e.target.closest('#absence-dropzone');
  if (adz) {
    e.preventDefault();
    const file = e.dataTransfer.files?.[0];
    if (file) parseAbsenceFile(file);
  }
  const udz = e.target.closest('#update-dropzone');
  if (udz) {
    e.preventDefault();
    const file = e.dataTransfer.files?.[0];
    if (file) parseUpdateFile(file);
  }
  const sdz = e.target.closest('#shift-dropzone');
  if (sdz) {
    e.preventDefault();
    const file = e.dataTransfer.files?.[0];
    if (file) handleShiftFileUpload(file);
  }
});

function parseBulkFile(file) {
  state.bulkFileName = file.name;
  state.bulkResults = null;
  const isCsv = file.name.toLowerCase().endsWith('.csv');
  if (isCsv) {
    Papa.parse(file, {
      header: true, skipEmptyLines: true,
      complete: (res) => { state.bulkRows = res.data.map(mapRow).filter(r => r.registry_number); render(); }
    });
  } else {
    const reader = new FileReader();
    reader.onload = (ev) => {
      const wb = XLSX.read(ev.target.result, { type: 'binary' });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const json = XLSX.utils.sheet_to_json(sheet);
      state.bulkRows = json.map(mapRow).filter(r => r.registry_number);
      render();
    };
    reader.readAsBinaryString(file);
  }
}

function downloadTemplate() {
  const csv = 'registry_number,first_name,last_name,department,annual_leave_total,password\n1024,Ayşe,Yılmaz,Muhasebe,14,\n';
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'calisan_sablonu.csv'; a.click();
  URL.revokeObjectURL(url);
}

async function handleBulkImport() {
  state.bulkImporting = true; render();
  try {
    const data = await callFunction('bulk-import-employees', {
      employees: state.bulkRows.map(r => ({ ...r, annual_leave_total: r.annual_leave_total ? Number(r.annual_leave_total) : 14 }))
    });
    state.bulkResults = data.results;
  } catch (err) {
    state.bulkResults = [{ registry_number: '-', success: false, error: err.message }];
  } finally {
    state.bulkImporting = false; render();
  }
}

   ===================================================================== */
window.addEventListener('hashchange', render);

applyTheme();

let firstAuthCheck = true;
fbAuth.onAuthStateChanged(async (user) => {
  state.session = user ? { user } : null;
  if (user) {
    state.profile = await fetchProfile(user.uid);
    if (!firstAuthCheck && (!location.hash || location.hash === '#/login')) {
      location.hash = state.profile?.role === 'admin' ? '#/admin' : '#/dashboard';
    }
  } else {
    state.profile = null;
    if (!firstAuthCheck) location.hash = '#/login';
  }
  state.loading = false;
  firstAuthCheck = false;
  render();
});
</script>
